name: Build UE Integration

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  BUN_VERSION: '1.3.11'

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows x64
            target: opencode-windows-x64
            artifact: opencode-ue-windows-x64
          - os: macos-latest
            name: macOS ARM64
            target: opencode-darwin-arm64
            artifact: opencode-ue-macos-arm64
          - os: macos-latest
            name: macOS x64
            target: opencode-darwin-x64
            artifact: opencode-ue-macos-x64
            cross: true
          - os: ubuntu-latest
            name: Linux x64
            target: opencode-linux-x64
            artifact: opencode-ue-linux-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Set package version
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd packages/opencode
          if command -v jq &> /dev/null; then
            jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json
          else
            sed -i.bak "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" package.json
          fi

      - name: Install dependencies
        run: bun install

      - name: Build App (Web UI)
        working-directory: packages/app
        run: bun run build

      - name: Build CLI
        working-directory: packages/opencode
        shell: bash
        env:
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            # Cross-compile using explicit target
            bun run script/build.ts --single --os=darwin --arch=x64 --skip-install
          else
            bun run script/build.ts --single --skip-install
          fi

      - name: Prepare release package
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p release/${{ matrix.artifact }}
          
          # Copy CLI
          cp -r packages/opencode/dist/${{ matrix.target }}/* release/${{ matrix.artifact }}/
          
          # Copy App
          mkdir -p release/${{ matrix.artifact }}/app
          cp -r packages/app/dist release/${{ matrix.artifact }}/app/dist

      - name: Create ZIP (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd release
          7z a -tzip ${{ matrix.artifact }}-v${VERSION}.zip ${{ matrix.artifact }}

      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd release
          tar -czvf ${{ matrix.artifact }}-v${VERSION}.tar.gz ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.artifact }}

    outputs:
      version: ${{ steps.version.outputs.version }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create archives
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          mkdir -p release
          
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            cd "$dir"
            if [[ "$name" == *"windows"* ]]; then
              zip -r "../../release/${name}-v${VERSION}.zip" .
            else
              tar -czvf "../../release/${name}-v${VERSION}.tar.gz" .
            fi
            cd ../..
          done
          
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: OpenCode UE v${{ needs.build.outputs.version }}
          draft: false
          prerelease: false
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
